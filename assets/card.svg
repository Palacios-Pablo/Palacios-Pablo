<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520">
  <defs>
    <style>

            /* Responsive seguro */
        @media (max-width: 800px) {
        .ascii-group {
            opacity: 0;
            pointer-events: none;
        }

        .terminal {
            transform: translate(80px,15px) scale(1.25);
        }
        }

        @media (max-width: 500px) {
        .ascii-group {
            display: none;
        }

        .terminal {
            transform: translate(40px,15px) scale(1.35);
        }
        }


      .mono { font-family: Consolas, Menlo, monospace; }
      .ascii { fill: #8b949e; font-size: 14px; letter-spacing: -0.2px; }
      .code { font-size: 12px; }
      .kw { fill: #7ee787; }
      .id { fill: #79c0ff; }
      .str { fill: #a5d6ff; }
      .punct { fill: #d29922; }


    <clipPath id="clipLeft">
      <rect x="0" y="0" width="720" height="700" />
    </clipPath>
  

      /* Animaciones */
      .cursor {
        animation: blink 1s steps(1) infinite;
        fill: #7ee787;
      }

      @keyframes blink {
        50% { opacity: 0; }
      }

      .fade {
        opacity: 0;
        animation: fadeIn 0.6s forwards;
      }

        .fade:nth-of-type(1) { animation-delay: 0.2s; }
        .fade:nth-of-type(2) { animation-delay: 0.4s; }
        .fade:nth-of-type(3) { animation-delay: 0.6s; }
        .fade:nth-of-type(4) { animation-delay: 0.8s; }
        .fade:nth-of-type(5) { animation-delay: 1s; }

      @keyframes fadeIn {
        to { opacity: 1; }
      }

      .flicker {
        animation: flicker 3s infinite;
      }

      @keyframes flicker {
        0%,100% { opacity: 1; }
        50% { opacity: 0.97; }
      }
    </style>

    <!-- Glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Scanlines -->
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="rgba(255,255,255,0.03)"/>
    </pattern>

    <clipPath id="clipLeft">
      <rect x="0" y="0" width="720" height="700" />
    </clipPath>
  </defs>


  <!-- Fondo -->
  <rect width="1400" height="700" rx="18" fill="#0d1117"/>

  <!-- Línea divisora 
  <line x1="720" y1="20" x2="720" y2="500" stroke="#30363d"/>-->

